<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Map</title>
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm': {
            type: 'raster',
            tiles: [
              'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256
          }
        },
        layers: [
          {
            id: 'osm',
            type: 'raster',
            source: 'osm',
            minzoom: 0,
            maxzoom: 19
          }
        ]
      },
      center: [17.23, 40.47],
      zoom: 12
    });

    map.on('load', async () => {
      console.log('Map loaded');

      try {
        const response = await fetch('https://taranto-viva.ddev.site/it/taranto_viva_geojson');
        console.log('Fetch response:', response.status);

        const data = await response.json();
        console.log('GeoJSON data:', data);
        console.log('Feature count:', data.features?.length);

        map.addSource('test-data', {
          type: 'geojson',
          data: data
        });

        map.addLayer({
          id: 'test-polygons',
          type: 'fill',
          source: 'test-data',
          filter: ['==', '$type', 'Polygon'],
          paint: {
            'fill-color': 'orange',
            'fill-opacity': 0.5
          }
        });

        map.addLayer({
          id: 'test-points',
          type: 'circle',
          source: 'test-data',
          filter: ['==', '$type', 'Point'],
          paint: {
            'circle-radius': 10,
            'circle-color': '#ff0000',
            'circle-stroke-color': '#000000',
            'circle-stroke-width': 1
          }
        });

        console.log('Layers added successfully');
      } catch (error) {
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
