# Local development services.
#
# To activate this feature, follow the instructions at the top of the
# 'example.settings.local.php' file, which sits next to this file.
parameters:
  twig.config:
    debug: true
    auto_reload: true # reloads the twig files on every request, so no drush cache clear is required
    cache: false # No twig internal cache, important: check the example.settings.local.php to fully disable the twig cache

  # The following setuo derived from this comment:
  # https://www.drupal.org/project/simple_instagram_feed/issues/3201098#comment-15026035
  http.response.debug_cacheability_headers: true

  # Configure Cross-Site HTTP requests (CORS).
  # Read https://developer.mozilla.org/en-US/docs/Web/HTTP/Access_control_CORS
  # for more information about the topic in general.
  # Note: By default the configuration is disabled.
  # The following setuo derived from this comment:
  # https://www.drupal.org/project/simple_instagram_feed/issues/3201098#comment-15026035
  cors.config:
    enabled: true
    # Specify allowed headers, like 'x-allowed-header'.
    allowedHeaders: [ '*' ]
    # Specify allowed request methods, specify ['*'] to allow all possible ones.
    allowedMethods: [ '*' ]
    # Configure requests allowed from specific origins. Do not include trailing
    # slashes with URLs.
    allowedOrigins: [ '*' ]
    # Sets the Access-Control-Expose-Headers header.
    exposedHeaders: false
    # Sets the Access-Control-Max-Age header.
    maxAge: false
    # Sets the Access-Control-Allow-Credentials header.
    supportsCredentials: false

services:
  cache.backend.null:
    class: Drupal\Core\Cache\NullBackendFactory
