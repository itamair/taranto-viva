general:
  version: VERSION
  css:
    component:
      css/leaflet_general.css: {}

leaflet:
  remote: http://leafletjs.com/
  license:
    name: Leaflet-License
    url: https://github.com/Leaflet/Leaflet/blob/master/LICENSE
    gpl-compatible: true
  js:
    /libraries/leaflet/dist/leaflet.js: {}
  css:
    component:
      /libraries/leaflet/dist/leaflet.css: {}

leaflet-drupal:
  js:
    js/leaflet.drupal.js: {}
  dependencies:
    - core/jquery
    - core/jquery.once
    - core/drupal
    - leaflet/leaflet

leaflet-markercluster:
  remote: https://github.com/Leaflet/Leaflet.markercluster
  license:
    name: MIT-License
    url: https://github.com/Leaflet/Leaflet.markercluster/blob/master/MIT-LICENCE.txt
    gpl-compatible: true
  js:
    /libraries/leaflet.markercluster/dist/leaflet.markercluster.js: {}
  css:
    component:
      /libraries/leaflet.markercluster/dist/MarkerCluster.css: {}
      /libraries/leaflet.markercluster/dist/MarkerCluster.Default.css: {}
  dependencies:
    - leaflet/leaflet

leaflet-markercluster-drupal:
  version: VERSION
  js:
    js/leaflet.markercluster.drupal.js: {}
  dependencies:
    - leaflet/leaflet-drupal

leaflet-geoman:
  css:
    theme:
      /libraries/geoman-io--leaflet-geoman-free/dist/leaflet-geoman.css: {}
  js:
    /libraries/geoman-io--leaflet-geoman-free/dist/leaflet-geoman.min.js: { minified: true }
  dependencies:
    - leaflet/leaflet

leaflet-widget:
  version: VERSION
  js:
    js/leaflet.widget.js: {}
  dependencies:
    - core/jquery
    - leaflet/general
    - leaflet/leaflet-geoman

# Control Fullscreen
leaflet.fullscreen:
  remote: https://github.com/Leaflet/Leaflet.fullscreen
  license:
    name: ISC License
    url: https://github.com/Leaflet/Leaflet.fullscreen/blob/gh-pages/LICENSE
    gpl-compatible: true
  css:
    component:
      /libraries/leaflet-fullscreen/dist/Leaflet.fullscreen.min.css: { minified: true }
  js:
    /libraries/leaflet-fullscreen/dist/Leaflet.fullscreen.min.js: { minified: true }
  dependencies:
    - leaflet/leaflet

# Gesture Handling Leaflet Library
leaflet.gesture_handling:
  remote: https://github.com/elmarquis/Leaflet.GestureHandling
  license:
    name: MIT License
    url: https://raw.githubusercontent.com/elmarquis/Leaflet.GestureHandling/master/LICENSE
    gpl-compatible: no
  css:
    component:
      /libraries/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.css: { minified: true}
  js:
    /libraries/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.js: { minified: true }
  dependencies:
    - leaflet/leaflet

leaflet.geocoder:
  version: VERSION
  css:
    component:
      css/leaflet_geocoder.css: {}
  js:
    js/leaflet.geocoder.js: {}
  dependencies:
    - core/drupal.autocomplete
    - leaflet/leaflet-drupal

leaflet.locate:
  remote: https://github.com/domoritz/leaflet-locatecontrol
  license:
    name: MIT
    url: https://raw.githubusercontent.com/domoritz/leaflet-locatecontrol/gh-pages/LICENSE
    gpl-compatible: yes
  css:
    component:
      /libraries/leaflet.locatecontrol/dist/L.Control.Locate.min.css: { minified: true }
  js:
    /libraries/leaflet.locatecontrol/dist/L.Control.Locate.min.js: { minified: true }

leaflet.resetview:
  remote: https://github.com/drustack/Leaflet.ResetView
  license:
    name: Apache-2.0
    url: https://raw.githubusercontent.com/drustack/Leaflet.ResetView/master/LICENSE
    gpl-compatible: yes
  css:
    component:
      /libraries/drustack--leaflet.resetview/dist/L.Control.ResetView.min.css: { minified: true }
  js:
    /libraries/drustack--leaflet.resetview/dist/L.Control.ResetView.min.js: { minified: true }
  dependencies:
    - leaflet/leaflet
