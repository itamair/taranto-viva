title: 'Taranto-Viva.com Intro'
body:
  value: '<p><span class="s1">Taranto-Viva.com</span><span> è una piattaforma digitale basata su tecnologie open source dedicata a documentare, esplorare e promuovere la città di Taranto attraverso mappe interattive, contenuti digitali georeferenziati e la condivisione civica della conoscenza del territorio.</span></p><p><a href="https://www.taranto-viva.com/it/">Entra</a> - <a href="https://www.taranto-viva.com/it/about"><span>Più Info</span></a></p>'
