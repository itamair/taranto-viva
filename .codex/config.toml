[mcp_servers.mcp-server-drupal]
command = "docker"
args = [
    "run",
    "-i",
    "--rm",
    "-e",
    "DRUPAL_AUTH_USER",
    "-e",
    "DRUPAL_AUTH_PASSWORD",
    "--network=host",
    "ghcr.io/omedia/mcp-server-drupal:latest",
    "--drupal-url=https://taranto-viva.ddev.site",
    "--unsafe-net",
]

