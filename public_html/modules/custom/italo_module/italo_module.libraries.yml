common:
  version: 1.x
  css:
    component:
      css/common.css: {}

leaflet_map_interactions:
  version: 1.x
  css:
    component:
      css/leaflet_map_interactions.css: {}
      css/leaflet_map_controls.css: {}
  js:
    js/leaflet_map_interactions.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal

leaflet_geometry_util:
  remote: https://github.com/makinacorpus/Leaflet.GeometryUtil
  version: 0.9.1
  license:
    name: BSD 3-Clause
    url: https://github.com/makinacorpus/Leaflet.GeometryUtil/blob/master/LICENSE
    gpl-compatible: true
  js:
    js/Leaflet.GeometryUtil/src/leaflet.geometryutil.js: {}
  dependencies:
    - leaflet/leaflet

leaflet-arrowheads:
  remote: https://github.com/slutske22/leaflet-arrowheads
  version: 1.4.0
  license:
    name: MIT License
    url: https://github.com/slutske22/leaflet-arrowheads/blob/master/LICENSE
    gpl-compatible: true
  js:
    js/leaflet-arrowheads/src/leaflet-arrowheads.js: {}
  dependencies:
    - italo_module/leaflet_geometry_util

leaflet_drupal_overrides:
  version: 1.x
  js:
    js/leaflet_drupal_overrides.js: {}
  dependencies:
    - leaflet/leaflet-drupal
    - italo_module/leaflet-arrowheads

leaflet_node_forced_bounds:
  version: 1.x
  js:
    js/leaflet_node_forced_bounds.js: {}

# Vendored IIFE build of leaflet-pmtiles-layer (bundles pmtiles,
# leaflet.vectorgrid, and @mapbox/vector-tile — no separate peer deps needed).
leaflet-pmtiles-layer:
  remote: https://github.com/calvinmetcalf/leaflet-pmtiles-layer
  version: 0.0.3
  license:
    name: MIT License
    url: https://github.com/calvinmetcalf/leaflet-pmtiles-layer/blob/main/LICENSE
    gpl-compatible: true
  js:
    js/leaflet-pmtiles-layer/Leaflet.PMTilesLayer.js: {}
  dependencies:
    - leaflet/leaflet

# Define a library to manage PM Tile layers
leaflet_pmtiles_layer:
  version: 1.x
  js:
    js/leaflet_pmtiles_layer.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal
    - italo_module/leaflet-pmtiles-layer

# Define a library to manage an Images/Immagini Leaflet Control
leaflet_map_control:
  version: 1.x
  js:
    js/leaflet_map_control.js: {}
  dependencies:
    - leaflet/leaflet
    - italo_module/leaflet_pmtiles_layer
