  options:
    parameters:
      search_api_server:
        type: entity:search_api_server
        with_config_overrides: TRUE
  requirements:
    _permission: 'administer search_api'
    _search_api_typesense_server_local_action_access_check: 'TRUE'

search_api_typesense.server.api_keys.delete:
